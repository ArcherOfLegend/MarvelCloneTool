name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import and round trip check
        run: |
          python -m compileall -q mvcclone main.py
          python tests/roundtrip.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install PyQt6 pyinstaller

      - name: Build
        run: >
          pyinstaller main.py
          --name MarvelCloneTool
          --onefile
          --windowed
          --noconfirm
          --clean

      - uses: actions/upload-artifact@v4
        with:
          name: MarvelCloneTool
          path: dist/MarvelCloneTool.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarvelCloneTool.exe
          generate_release_notes: true
